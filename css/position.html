<html>

<head>
    <title>position</title>

</head>

<body>
    <style>
        .static {
            height: 100px;
            width: 50px;
            background-color: aqua;
            position: static;
        }

        .fixed {
            height: 100px;
            width: 50px;
            background-color: red;
            position: fixed;
            right: 0;
        }

        .sticky {
            top: 0;
            height: 100px;
            width: 50px;
            background-color: brown;
            position: sticky;
        }
    </style>
    <div class="static">static</div>
    <div class="fixed">fixed</div>
    <div class="sticky">sticky</div>

</body>

</html>

<html>

<head>
    <title>background</title>
</head>
<style>
    .bg {
        width: 60%;
        height: 200px;
        color: blue;
        background-color: aquamarine;
        background-image: url(https://cdn.britannica.com/36/234736-050-4AC5B6D5/Scottish-fold-cat.jpg);
        background-size: 56px;
        background-repeat: no-repeat;
        background-position: right;

        /* font: bold weight italic   'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;; */

    }

    .grad {
        width: 60%;
        height: 50%;
        background: linear-gradient(160deg, red, black);
    }

    .radial {
        width: 60%;
        height: 50%;
        background: radial-gradient(blue, black);
    }

    .font {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: medium;
        font-weight: bolder;
        font-style: italic;
        font-variant: small-caps;
        box-shadow: 3px 4px 6px;
    }

    .text {
        width: 100%;
        height: 60%;
        text-transform: capitalize;
        text-align: center;
        text-decoration: underline;
        text-decoration-color: brown;
        text-decoration-style: dotted;
        text-shadow: 3px 4px 6px red;
        text-decoration-thickness: 5px;


    }
</style>

<body>
    <div class="bg">
        <h1>Background</h1>
    </div>

    <div class="grad">

    </div>
    <div class="radial">

    </div>
    <div class="font">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium odio id commodi rem natus ducimus
            sapiente excepturi optio odit, totam quisquam quos veritatis, quia obcaecati laudantium et est enim? Illo!
        </p>
    </div>
    <div class="text">
        <p>Deva krishnan</p>
    </div>


</body>

</html>

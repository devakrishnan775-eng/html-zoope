<html>
    <head>
        <title>display</title>
<style>
    .box{
        background-color: red;
        margin: 3%;
    }
    .block{
        display: block;
        width: 100px;
        height: 100px;
    }
.inline{
display: inline;

}
.inlineblock{
    display: inline-block;
    width: 200;
    height: 200;
}
.hello{
    display:none;
}
.visibility{
    visibility: hidden;
}
</style>        
    </head>

    <body>
  <div class="box block">hello</div> 
    <div class="box block">hello</div>      
     

  <div class="box inline">hello</div>      
    <div class="box inline">inline</div>  <br>

    <div class="box inlineblock">hiiiii</div>

    <div class="box hello">hello</div>
    <div class="box visibility"> hhhhhh</div>
    jjhj
    </body>
</html>
